# Только для разработки на своём компьютере. Своё имя проекта и порт на 127.0.0.1: если на сервере
# этот файл запустят по ошибке, он не заменит рабочую базу и не откроет порт наружу.
name: film-prod-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: filmprod
      POSTGRES_PASSWORD: filmprod
      POSTGRES_DB: filmprod
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - filmprod_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filmprod -d filmprod"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  filmprod_pg:
