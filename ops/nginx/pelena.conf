# Сайт за nginx. Устанавливается командой ops/nginx/setup.sh.

server_tokens off;

# Адрес сервера и чужие имена не отвечают сайтом.
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

# http: выпуск сертификата и редирект на https.
server {
    listen 80 default_server;
    server_name pelena.space www.pelena.space _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://pelena.space$request_uri;
    }
}

# Общие настройки https: сертификат один на оба имени.
ssl_certificate /etc/letsencrypt/live/pelena.space/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/pelena.space/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:pelena:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# www: постоянный редирект на основной адрес.
server {
    listen 443 ssl http2;
    server_name www.pelena.space;
    return 301 https://pelena.space$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pelena.space;

    # Загрузки на сайте ограничены 512 МБ, форма добавляет служебные данные.
    client_max_body_size 600m;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Next.js читает список файлов public при запуске и новые загрузки сам не отдаёт.
    location ^~ /uploads/ {
        alias /mnt/data/uploads/;
        autoindex off;
        limit_except GET { deny all; }
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Заменяем, а не дописываем: подделанный посетителем адрес до сайта не доходит.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        # Выгрузка на Диск и большие файлы идут дольше обычного.
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
