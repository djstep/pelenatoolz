# Сайт за nginx. Устанавливается командой ops/nginx/setup.sh.

server_tokens off;

# Пределы на один адрес посетителя. Только POST: страницы и файлы сайта не считаются.
# Защищают от перебора входа: каждая попытка стоит дорогого расчёта пароля на сервере.
map $request_method $pelena_post_key {
    POST $binary_remote_addr;
    default "";
}
limit_req_zone $pelena_post_key zone=pelena_post:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=pelena_conn:10m;
# Отдельный счётчик: большие загрузки не считаются вместе с обычными запросами страницы.
limit_conn_zone $binary_remote_addr zone=pelena_upload:10m;
limit_req_status 429;
limit_conn_status 429;

# Адрес сервера и чужие имена не отвечают сайтом.
server {
    listen 443 ssl http2 default_server;
    ssl_reject_handshake on;
}

# http: выпуск сертификата и редирект на https.
server {
    listen 80 default_server;
    server_name pelena.space www.pelena.space _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://pelena.space$request_uri;
    }
}

# www: постоянный редирект на основной адрес.
server {
    listen 443 ssl http2;
    server_name www.pelena.space;
    include /etc/nginx/snippets/pelena-ssl.conf;
    return 301 https://pelena.space$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pelena.space;
    include /etc/nginx/snippets/pelena-ssl.conf;

    # Больше всего на обычных адресах принимают сметы и импорт: 4 МБ и картинки до 8 МБ.
    client_max_body_size 10m;
    limit_conn pelena_conn 100;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Большие файлы только здесь. Тело сразу идёт в сайт, а не на диск nginx: вход проверяется
    # раньше чтения тела, поэтому посторонний не заполнит диск.
    # Сайт принимает здесь ровно 512 МБ: файл идёт телом запроса, без разметки формы.
    # Таймауты nginx считают паузы, а не всю загрузку. 5 минут тишины переживёт телефон в метро;
    # proxy_send_timeout и proxy_read_timeout те же 5 минут, из pelena-proxy.conf. Предел всей
    # загрузки, 60 минут, задаёт scripts/server-timeouts.cjs.
    location ~ ^/api/projects/[^/]+/uploads/(video|file)$ {
        client_max_body_size 512m;
        client_body_timeout 300s;
        limit_conn pelena_upload 8;
        proxy_request_buffering off;
        include /etc/nginx/snippets/pelena-proxy.conf;
    }

    # Файлы идут в браузер напрямую: иначе nginx копировал бы видео во временный файл на SSD с базой.
    location ~ ^/api/projects/[^/]+/media/ {
        proxy_buffering off;
        include /etc/nginx/snippets/pelena-proxy.conf;
    }

    location / {
        limit_req zone=pelena_post burst=40 nodelay;
        include /etc/nginx/snippets/pelena-proxy.conf;
    }
}
